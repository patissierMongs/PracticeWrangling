# Database Configuration File
# This file contains database connection settings for different environments

[DEFAULT]
# Default settings that apply to all environments unless overridden
charset = utf8mb4
collation = utf8mb4_unicode_ci
timeout = 30
autocommit = true
ssl_verify_cert = true
sql_mode = STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO

[production]
# Production database settings
driver = mysql
host = prod-db-cluster.company.com
port = 3306
database = ecommerce_prod
username = prod_user
password = SuperSecurePass123!@#
pool_size = 20
max_overflow = 30
pool_timeout = 30
pool_recycle = 3600

# Master-Slave configuration
read_host = prod-db-read-replica.company.com
read_port = 3306
read_username = read_only_user
read_password = ReadOnlyPass456$%^

# SSL Configuration
ssl_ca = /etc/ssl/certs/ca-cert.pem
ssl_cert = /etc/ssl/certs/client-cert.pem
ssl_key = /etc/ssl/private/client-key.pem

[staging]
# Staging environment database settings
driver = mysql
host = staging-db.company.com
port = 3306
database = ecommerce_staging
username = staging_user
password = StagingPass789&*(
pool_size = 10
max_overflow = 15
pool_timeout = 20
pool_recycle = 1800

[development]
# Development environment database settings
driver = mysql
host = localhost
port = 3306
database = ecommerce_dev
username = dev_user
password = DevPass123
pool_size = 5
max_overflow = 10
pool_timeout = 10
pool_recycle = 600
echo = true  # Enable SQL query logging in development

[testing]
# Testing environment database settings
driver = sqlite
database = :memory:
# SQLite doesn't use host, port, username, password
pool_size = 1
pool_timeout = 5

[analytics]
# Analytics warehouse database
driver = postgresql
host = analytics-warehouse.company.com
port = 5432
database = data_warehouse
username = analytics_user
password = AnalyticsPass012)!@
pool_size = 15
max_overflow = 25
pool_timeout = 45
pool_recycle = 7200

# PostgreSQL specific settings
options = -c timezone=UTC

[reporting]
# Reporting database (read-only replica)
driver = mysql
host = reporting-db.company.com
port = 3306
database = ecommerce_reporting
username = report_user
password = ReportPass345#$%
pool_size = 8
max_overflow = 12
pool_timeout = 60
pool_recycle = 3600

# Read-only mode
autocommit = false
read_only = true

[cache]
# Cache database (Redis)
driver = redis
host = redis-cluster.company.com
port = 6379
password = RedisPass678^&*
database = 0
max_connections = 50
retry_on_timeout = true
health_check_interval = 30

# Redis Cluster nodes
cluster_nodes = redis-node1.company.com:6379,redis-node2.company.com:6379,redis-node3.company.com:6379

[session]
# Session storage database
driver = redis
host = session-redis.company.com
port = 6379
password = SessionPass901()!
database = 1
max_connections = 20
socket_timeout = 5
socket_connect_timeout = 5

[queue]
# Queue database (Redis)
driver = redis
host = queue-redis.company.com
port = 6379
password = QueuePass234@#$
database = 2
max_connections = 30
retry_on_timeout = true
connection_pool_class = redis.BlockingConnectionPool

[backup]
# Backup database settings
driver = mysql
host = backup-db.company.com
port = 3306
database = ecommerce_backup
username = backup_user
password = BackupPass567%^&
pool_size = 5
max_overflow = 5
pool_timeout = 120
pool_recycle = 1800

# Backup specific settings
backup_retention_days = 30
compression = gzip
encryption_key = backup_encryption_key_abc123

[logging]
# Database for application logs
driver = elasticsearch
host = elasticsearch.company.com
port = 9200
username = elastic_user
password = ElasticPass890*()
index_prefix = app_logs
ssl_enabled = true
timeout = 30
max_retries = 3

# Elasticsearch specific settings
number_of_shards = 3
number_of_replicas = 1

[metrics]
# Metrics database (InfluxDB)
driver = influxdb
host = metrics-db.company.com
port = 8086
database = application_metrics
username = metrics_user
password = MetricsPass123!@#
timeout = 10
retries = 3

# InfluxDB specific settings
retention_policy = 90d
measurement_prefix = app_

[local_development]
# Local development with Docker
driver = mysql
host = mysql-container
port = 3306
database = ecommerce_local
username = root
password = rootpass
pool_size = 3
max_overflow = 5
pool_timeout = 5
pool_recycle = 300

# Docker specific settings
docker_compose_service = mysql

[test_integration]
# Integration testing database
driver = mysql
host = test-db.company.com
port = 3306
database = ecommerce_integration_test
username = integration_test_user
password = IntegrationTestPass456
pool_size = 2
max_overflow = 3
pool_timeout = 15
pool_recycle = 600

# Test specific settings
cleanup_after_test = true
seed_data = true

[readonly_replica]
# Read-only replica for heavy reporting queries
driver = mysql
host = readonly-replica.company.com
port = 3306
database = ecommerce_prod
username = readonly_user
password = ReadOnlyReplicaPass789
pool_size = 15
max_overflow = 20
pool_timeout = 60
pool_recycle = 3600

# Read-only specific settings
transaction_isolation = READ_COMMITTED
read_only = true
query_timeout = 300

[sharded_db_1]
# First shard of horizontally partitioned data
driver = mysql
host = shard1-db.company.com
port = 3306
database = ecommerce_shard1
username = shard_user
password = ShardPass123ABC
pool_size = 10
max_overflow = 15
shard_id = 1
shard_range = 0-999999

[sharded_db_2]
# Second shard of horizontally partitioned data
driver = mysql
host = shard2-db.company.com
port = 3306
database = ecommerce_shard2
username = shard_user
password = ShardPass456DEF
pool_size = 10
max_overflow = 15
shard_id = 2
shard_range = 1000000-1999999

[monitoring]
# Database monitoring and health checks
driver = mysql
host = monitoring-db.company.com
port = 3306
database = monitoring
username = monitor_user
password = MonitorPass789GHI
pool_size = 5
max_overflow = 5
pool_timeout = 10

# Monitoring specific settings
health_check_interval = 30
slow_query_threshold = 2.0
connection_check_interval = 60

[archive]
# Archive database for old data
driver = mysql
host = archive-db.company.com
port = 3306
database = ecommerce_archive
username = archive_user
password = ArchivePass012JKL
pool_size = 3
max_overflow = 5
pool_timeout = 300

# Archive specific settings
compression = true
retention_years = 7
archival_schedule = monthly